<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Profile — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="form-page">

        <section class="form-card">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>My Profile</h1>

            <div id="info" class="muted">
                Loading...
            </div>

            <button
                type="button"
                class="primary"
                onclick="logoutUser()">
                Logout
            </button>

        </section>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        const profileInfo =
            document.getElementById("info");

        async function loadProfile() {

            try {

                const response = await fetch(
                    "/api/users/me",
                    {
                        headers: authHeaders()
                    }
                );

                const data =
                    await response.json();

                if (data.user) {

                    profileInfo.innerHTML = `
                        <p>
                            <strong>Name:</strong>
                            ${data.user.name || "—"}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            ${data.user.email || "—"}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${data.user.phone || "—"}
                        </p>
                    `;

                } else {

                    profileInfo.innerHTML =
                        "Please login to view your profile.";

                }

            } catch (error) {

                console.error(error);

                profileInfo.innerHTML =
                    "Unable to load profile.";

            }
        }

        function logoutUser() {

            localStorage.removeItem("token");
            localStorage.removeItem("goride_token");
            localStorage.removeItem("user");
            localStorage.removeItem("goride_user");

            window.location.href =
                "../index.html";
        }

        loadProfile();
    </script>

</body>

</html>
