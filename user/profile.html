<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><section class="form-card"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>My Profile</h1><div id="info" class="muted">Loading...</div><button class="primary" onclick="localStorage.clear();location.href='../index.html'">Logout</button></section></div><script src="../js/app.js"></script><script>(async()=>{const d=await fetch("/api/users/me",{headers:authHeaders()}).then(r=>r.json());info.innerHTML=d.user?`<p>Name: ${d.user.name}</p><p>Email: ${d.user.email||"—"}</p><p>Phone: ${d.user.phone||"—"}</p>`:"Please login"})()</script></body></html>
