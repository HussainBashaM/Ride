<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><form class="form-card" id="form"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>Reset password</h1><input class="input" id="token" placeholder="Reset token" required><input class="input" id="password" type="password" placeholder="New password" required><button class="primary">Reset Password</button><p id="msg"></p></form></div><script src="../js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const d=await postJSON("/api/auth/reset-password",{token:token.value,password:password.value});msg.textContent=d.message}</script></body></html>
