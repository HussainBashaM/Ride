<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset Password — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="form">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Reset password</h1>

            <input
                class="input"
                id="token"
                type="text"
                placeholder="Reset token"
                required
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="New password"
                required
            >

            <button
                class="primary"
                type="submit">
                Reset Password
            </button>

            <p id="msg"></p>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        const resetForm =
            document.getElementById("form");

        const tokenInput =
            document.getElementById("token");

        const passwordInput =
            document.getElementById("password");

        const message =
            document.getElementById("msg");

        resetForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                message.textContent =
                    "Resetting password...";

                try {

                    const data = await postJSON(
                        "/api/auth/reset-password",
                        {
                            token:
                                tokenInput.value.trim(),

                            password:
                                passwordInput.value
                        }
                    );

                    message.textContent =
                        data.message ||
                        "Password reset completed.";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );
    </script>

</body>

</html>
