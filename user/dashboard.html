<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Top Bar -->
        <div class="topbar">
            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <span class="muted">Passenger Dashboard</span>
        </div>

        <!-- Dashboard Grid -->
        <div class="dash-grid">

            <!-- Map -->
            <div id="map" class="map">
                <div class="map-badge">● Live map</div>
            </div>

            <!-- Booking Panel -->
            <section class="panel">

                <h2>Book a Ride</h2>

                <label for="pickup">Pickup</label>
                <input
                    class="input"
                    id="pickup"
                    type="text"
                    placeholder="Enter pickup location"
                    oninput="estimate()"
                >

                <label for="destination">Destination</label>
                <input
                    class="input"
                    id="destination"
                    type="text"
                    placeholder="Where are you going?"
                    oninput="estimate()"
                >

                <h3>Choose Vehicle</h3>

                <div class="vehicle">

                    <button
                        type="button"
                        class="active"
                        onclick="selectVehicle('Bike', this)"
                    >
                        🛵
                        <br>
                        Bike
                    </button>

                    <button
                        type="button"
                        onclick="selectVehicle('Auto', this)"
                    >
                        🛺
                        <br>
                        Auto
                    </button>

                    <button
                        type="button"
                        onclick="selectVehicle('Car', this)"
                    >
                        🚗
                        <br>
                        Car
                    </button>

                </div>

                <!-- Ride Details -->
                <div class="stat">
                    <span>Distance</span>
                    <b id="distance">--</b>
                </div>

                <div class="stat">
                    <span>ETA</span>
                    <b id="time">--</b>
                </div>

                <div class="stat">
                    <span>Estimated Fare</span>
                    <b id="fare">--</b>
                </div>

                <!-- Confirm -->
                <button
                    type="button"
                    class="primary full"
                    onclick="confirmRide()"
                >
                    Confirm Ride
                </button>

            </section>

        </div>

    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>
    <script src="../js/map.js"></script>
    <script src="../js/booking.js"></script>

</body>

</html>
