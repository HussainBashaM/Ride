<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="form">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Create account</h1>

            <input
                class="input"
                id="name"
                type="text"
                placeholder="Full name"
                required
            >

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                class="input"
                id="phone"
                type="tel"
                placeholder="Phone"
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button
                class="primary"
                type="submit">
                Register
            </button>

            <p class="muted">
                Already registered?
                <a
                    class="link"
                    href="login.html">
                    Login
                </a>
            </p>

            <p id="msg"></p>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        const registerForm =
            document.getElementById("form");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const phoneInput =
            document.getElementById("phone");

        const passwordInput =
            document.getElementById("password");

        const message =
            document.getElementById("msg");

        registerForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                message.textContent =
                    "Creating account...";

                try {

                    const data = await postJSON(
                        "/api/auth/register",
                        {
                            name:
                                nameInput.value.trim(),

                            email:
                                emailInput.value.trim() ||
                                undefined,

                            phone:
                                phoneInput.value.trim() ||
                                undefined,

                            password:
                                passwordInput.value
                        }
                    );

                    if (data.success) {

                        saveAuth(data);

                        window.location.href =
                            "dashboard.html";

                    } else {

                        message.textContent =
                            data.message ||
                            "Registration failed";

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );
    </script>

</body>

</html>
