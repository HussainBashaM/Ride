<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="form">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Create account</h1>

            <input
                class="input"
                id="name"
                type="text"
                placeholder="Full name"
                required
            >

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                class="input"
                id="phone"
                type="tel"
                placeholder="Phone"
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button
                class="primary"
                type="submit">
                Register
            </button>

            <p class="muted">
                Already registered?
                <a
                    class="link"
                    href="login.html">
                    Login
                </a>
            </p>

            <p id="msg"></p>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>
    <script>
    const registerForm = document.getElementById("form");

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("msg");

    const API_BASE =
        window.GORIDE_API ||
        window.API_BASE_URL ||
        "https://ride-f6la.onrender.com";

    registerForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        message.textContent = "Creating account...";
        message.style.display = "block";

        try {

            const response = await fetch(
                API_BASE + "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: nameInput.value.trim(),

                        email:
                            emailInput.value.trim() ||
                            undefined,

                        phone:
                            phoneInput.value.trim() ||
                            undefined,

                        password:
                            passwordInput.value
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Registration failed"
                );
            }

            if (data.success) {

                const receivedToken =
                    data.token ||
                    data.accessToken ||
                    data.jwt;

                const receivedUser =
                    data.user ||
                    data.data?.user ||
                    data.account;

                if (receivedToken) {
                    localStorage.setItem(
                        "token",
                        receivedToken
                    );

                    localStorage.setItem(
                        "goride_token",
                        receivedToken
                    );
                }

                if (receivedUser) {
                    localStorage.setItem(
                        "user",
                        JSON.stringify(receivedUser)
                    );

                    localStorage.setItem(
                        "goride_user",
                        JSON.stringify(receivedUser)
                    );
                }

                localStorage.setItem(
                    "goride_role",
                    "user"
                );

                message.textContent =
                    "Account created successfully!";

                message.style.color = "green";

                setTimeout(function () {
                    window.location.href =
                        "dashboard.html";
                }, 500);

            } else {

                message.textContent =
                    data.message ||
                    "Registration failed";
            }

        } catch (error) {

            console.error(
                "GoRide registration error:",
                error
            );

            message.textContent =
                error.message ||
                "Unable to connect to server.";

        }

    });
    </script>
