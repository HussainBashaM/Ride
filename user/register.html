<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><form class="form-card" id="form"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>Create account</h1><input class="input" id="name" placeholder="Full name" required><input class="input" id="email" placeholder="Email"><input class="input" id="phone" placeholder="Phone"><input class="input" id="password" type="password" placeholder="Password" required><button class="primary">Register</button><p class="muted">Already registered? <a class="link" href="login.html">Login</a></p><p id="msg"></p></form></div><script src="../js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const d=await postJSON("/api/auth/register",{name:name.value,email:email.value||undefined,phone:phone.value||undefined,password:password.value});if(d.success){saveAuth(d);location.href="dashboard.html"}else msg.textContent=d.message||"Registration failed"}</script></body></html>
