<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ride History — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="dashboard"><div class="topbar"><a class="brand" href="../index.html">Go<span>Ride</span></a><h2>Ride History</h2></div><section class="panel" id="list">Loading...</section></div><script src="../js/app.js"></script><script>(async()=>{const d=await fetch("/api/rides/my",{headers:authHeaders()}).then(r=>r.json());list.innerHTML=d.rides?.map(r=>`<div class="stat"><span>${r.pickup?.name||"Pickup"} → ${r.destination?.name||"Destination"}</span><b>₹${r.fare} · ${r.status}</b></div>`).join("")||"No rides yet"})()</script></body></html>
