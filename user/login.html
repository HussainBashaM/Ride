<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>User Login — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="loginForm">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Welcome back</h1>

            <p class="muted">
                Login to book your next ride.
            </p>

            <label for="identity">
                Email or Phone
            </label>

            <input
                class="input"
                id="identity"
                type="text"
                placeholder="Email or phone"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button
                class="primary"
                type="submit">
                Login
            </button>

            <p>
                <a
                    class="link"
                    href="forgot-password.html">
                    Forgot password?
                </a>
            </p>

            <p class="muted">
                New user?
                <a
                    class="link"
                    href="register.html">
                    Create account
                </a>
            </p>

            <p id="msg"></p>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>

    <!-- Login Logic -->
    <script>
        const loginForm =
            document.getElementById("loginForm");

        const identityInput =
            document.getElementById("identity");

        const passwordInput =
            document.getElementById("password");

        const message =
            document.getElementById("msg");

        loginForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                message.textContent =
                    "Logging in...";

                const value =
                    identityInput.value.trim();

                try {

                    const data = await postJSON(
                        "/api/auth/login",
                        {
                            email:
                                value.includes("@")
                                    ? value
                                    : undefined,

                            phone:
                                value.includes("@")
                                    ? undefined
                                    : value,

                            password:
                                passwordInput.value,

                            role: "user"
                        }
                    );

                    if (data.success) {

                        saveAuth(data);

                        if (
                            typeof goAfterLogin ===
                            "function"
                        ) {
                            goAfterLogin();
                        } else {
                            window.location.href =
                                "dashboard.html";
                        }

                    } else {

                        message.textContent =
                            data.message ||
                            "Login failed";

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );
    </script>

</body>

</html>
