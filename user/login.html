<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Login — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><form class="form-card" id="loginForm"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>Welcome back</h1><p class="muted">Login to book your next ride.</p><label>Email or Phone</label><input class="input" id="identity" required><label>Password</label><input class="input" id="password" type="password" required><button class="primary" type="submit">Login</button><p><a class="link" href="forgot-password.html">Forgot password?</a></p><p class="muted">New user? <a class="link" href="register.html">Create account</a></p><p id="msg"></p></form></div><script src="../js/app.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();const v=identity.value;const d=await postJSON("/api/auth/login",{email:v.includes("@")?v:undefined,phone:v.includes("@")?undefined:v,password,role:"user"});if(d.success){saveAuth(d);goAfterLogin()}else msg.textContent=d.message||"Login failed"}</script><script src="../js/auth.js"></script></body></html>
