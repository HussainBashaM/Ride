<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Forgot Password — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="form">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Forgot password?</h1>

            <p class="muted">
                Enter your email or phone to request a reset.
            </p>

            <input
                class="input"
                id="identity"
                type="text"
                placeholder="Email or phone"
                required
            >

            <button
                type="submit"
                class="primary">
                Send Reset Request
            </button>

            <p id="msg"></p>

            <a
                class="link"
                href="reset-password.html">
                I have a reset token
            </a>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        const forgotForm =
            document.getElementById("form");

        const identityInput =
            document.getElementById("identity");

        const message =
            document.getElementById("msg");

        forgotForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                message.textContent =
                    "Sending reset request...";

                try {

                    const data = await postJSON(
                        "/api/auth/forgot-password",
                        {
                            identity:
                                identityInput.value.trim()
                        }
                    );

                    message.textContent =
                        data.message ||
                        "Reset request sent.";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );
    </script>

</body>

</html>
