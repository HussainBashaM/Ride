<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><form class="form-card" id="form"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>Forgot password?</h1><p class="muted">Enter your email or phone to request a reset.</p><input class="input" id="identity" required placeholder="Email or phone"><button class="primary">Send Reset Request</button><p id="msg"></p><a class="link" href="reset-password.html">I have a reset token</a></form></div><script src="../js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const d=await postJSON("/api/auth/forgot-password",{identity:identity.value});msg.textContent=d.message}</script></body></html>
