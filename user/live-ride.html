<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Live Ride — GoRide</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5ff;
            color: #20202a;
            font-family: Arial, sans-serif;
        }

        .live-app {
            width: 100%;
            max-width: 700px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .live-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: white;
        }

        .brand {
            text-decoration: none;
            color: #222;
            font-size: 26px;
            font-weight: 800;
        }

        .brand span {
            color: #7c3aed;
        }

        .live-badge {
            padding: 8px 12px;
            border-radius: 20px;
            background: #e9f9ef;
            color: #188044;
            font-size: 12px;
            font-weight: 700;
        }

        .status-card {
            margin: 16px;
            padding: 20px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .status-label {
            color: #777;
            font-size: 12px;
            margin-bottom: 6px;
        }

        #rideStatus {
            margin: 0;
            color: #6d28d9;
            font-size: 23px;
        }

        #statusMessage {
            margin: 8px 0 0;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .map-wrap {
            margin: 16px;
            overflow: hidden;
            border-radius: 22px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .10);
        }

        #map {
            width: 100%;
            height: 350px;
            position: relative;
        }

        .map-badge {
            position: absolute;
            z-index: 500;
            top: 14px;
            left: 14px;
            padding: 9px 13px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 4px 15px rgba(0,0,0,.12);
            font-size: 12px;
            font-weight: 600;
        }

        .ride-card {
            margin: 16px;
            padding: 20px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .ride-title {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .location {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .dot {
            width: 12px;
            height: 12px;
            margin-top: 5px;
            border-radius: 50%;
            background: #22a95a;
            flex-shrink: 0;
        }

        .dot.destination {
            background: #7c3aed;
        }

        .location small {
            display: block;
            color: #777;
            margin-bottom: 4px;
        }

        .location strong {
            display: block;
            font-size: 14px;
            line-height: 1.4;
        }

        .details {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 8px;
            padding: 14px;
            margin-top: 5px;
            border-radius: 16px;
            background: #f7f6fa;
            text-align: center;
        }

        .details span {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .details b {
            font-size: 15px;
        }

        .driver-card {
            margin: 16px;
            padding: 18px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .driver-title {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .driver-message {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .actions {
            margin: 16px;
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .primary-btn {
            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );
            color: white;
        }

        .danger-btn {
            background: #ffe9e9;
            color: #c62828;
        }

        .secondary-btn {
            background: #eee8ff;
            color: #6d28d9;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 380px) {

            .details {
                grid-template-columns: 1fr;
            }

            #map {
                height: 300px;
            }
        }

    </style>

</head>

<body>

<div class="live-app">

    <header class="live-topbar">

        <a
            class="brand"
            href="../index.html"
        >
            Go<span>Ride</span>
        </a>

        <span
            id="liveBadge"
            class="live-badge"
        >
            ● LIVE
        </span>

    </header>


    <!-- STATUS -->

    <section class="status-card">

        <div class="status-label">
            CURRENT RIDE STATUS
        </div>

        <h2 id="rideStatus">
            Searching for driver...
        </h2>

        <p id="statusMessage">
            Your ride request has been sent
            to nearby drivers.
        </p>

    </section>


    <!-- MAP -->

    <section class="map-wrap">

        <div id="map">

            <div class="map-badge">
                🛵 Driver location updates live
            </div>

        </div>

    </section>


    <!-- RIDE DETAILS -->

    <section class="ride-card">

        <h3 class="ride-title">
            Your Ride
        </h3>


        <div class="location">

            <span class="dot"></span>

            <div>

                <small>
                    Pickup
                </small>

                <strong id="pickup">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="location">

            <span class="dot destination"></span>

            <div>

                <small>
                    Destination
                </small>

                <strong id="destination">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="details">

            <div>

                <span>
                    Vehicle
                </span>

                <b id="vehicle">
                    --
                </b>

            </div>


            <div>

                <span>
                    Distance
                </span>

                <b id="distance">
                    --
                </b>

            </div>


            <div>

                <span>
                    Fare
                </span>

                <b id="fare">
                    ₹--
                </b>

            </div>

        </div>

    </section>


    <!-- DRIVER INFORMATION -->

    <section
        class="driver-card"
        id="driverCard"
    >

        <h3 class="driver-title">
            🛵 Driver
        </h3>

        <p
            id="driverMessage"
            class="driver-message"
        >
            Searching for a nearby driver...
        </p>

    </section>


    <!-- ACTIONS -->

    <section class="actions">

        <button
            id="cancelBtn"
            class="action-btn danger-btn"
            onclick="cancelRide()"
        >
            ❌ Cancel Ride
        </button>


        <button
            class="action-btn secondary-btn"
            onclick="goDashboard()"
        >
            Back to Dashboard
        </button>

    </section>

</div>


<!-- SOCKET.IO -->

<script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>


<!-- APP -->

<script src="../js/app.js"></script>
    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>

    <script src="../js/app.js"></script>
    <script src="../js/map.js"></script>

    <script>

        /* =====================================================
           ACTIVE RIDE
           ===================================================== */

        const rideInfo =
            document.getElementById("rideInfo");

        let activeRide = JSON.parse(
            localStorage.getItem("goride_active_ride") ||
            "null"
        );


        /* =====================================================
           SHOW RIDE INFORMATION
           ===================================================== */

        function renderRideInfo() {

            if (!rideInfo) return;

            if (!activeRide) {

                rideInfo.innerHTML = `
                    <div class="stat">
                        <span>Status</span>
                        <b>Waiting for ride...</b>
                    </div>
                `;

                return;
            }


            rideInfo.innerHTML = `

                <div class="stat">
                    <span>Vehicle</span>
                    <b>
                        ${activeRide.vehicleType || "—"}
                    </b>
                </div>

                <div class="stat">
                    <span>Distance</span>
                    <b>
                        ${
                            activeRide.distance
                            ? Number(activeRide.distance).toFixed(1) + " km"
                            : "—"
                        }
                    </b>
                </div>

                <div class="stat">
                    <span>Fare</span>
                    <b>
                        ${
                            activeRide.fare
                            ? "₹" + Math.round(activeRide.fare)
                            : "—"
                        }
                    </b>
                </div>

                <div class="stat">
                    <span>Status</span>
                    <b id="liveStatus">
                        ${activeRide.status || "SEARCHING_DRIVER"}
                    </b>
                </div>

            `;
        }


        renderRideInfo();


        /* =====================================================
           SOCKET CONNECTION
           ===================================================== */

        const API_BASE =
            window.GORIDE_API ||
            window.API_BASE_URL ||
            localStorage.getItem("API_BASE_URL") ||
            "https://ride-f6la.onrender.com";


        let socket = null;


        if (typeof io === "function") {

            socket = io(API_BASE, {
                transports: ["websocket", "polling"]
            });


            socket.on(
                "connect",
                function () {

                    console.log(
                        "GoRide passenger socket connected"
                    );

                    const user =
                        JSON.parse(
                            localStorage.getItem("user") ||
                            localStorage.getItem("goride_user") ||
                            "null"
                        );


                    const userId =
                        user?.id ||
                        user?._id;


                    if (userId) {

                        socket.emit(
                            "join:user",
                            userId
                        );
                    }
                }
            );


            /* =================================================
               RIDE UPDATE
               ================================================= */

            socket.on(
                "ride:update",
                function (ride) {

                    if (!activeRide) return;


                    if (
                        String(ride._id) !==
                        String(activeRide._id)
                    ) {
                        return;
                    }


                    activeRide = ride;


                    localStorage.setItem(
                        "goride_active_ride",
                        JSON.stringify(activeRide)
                    );


                    renderRideInfo();


                    updateStatusText(
                        ride.status
                    );


                    console.log(
                        "Ride updated:",
                        ride
                    );


                    if (
                        ride.status ===
                        "RIDE_COMPLETED"
                    ) {

                        setTimeout(
                            function () {

                                window.location.href =
                                    "ride-history.html";

                            },
                            1500
                        );
                    }


                    if (
                        ride.status ===
                        "CANCELLED"
                    ) {

                        setTimeout(
                            function () {

                                window.location.href =
                                    "dashboard.html";

                            },
                            1500
                        );
                    }
                }
            );


            /* =================================================
               DRIVER LOCATION
               ================================================= */

            socket.on(
                "driver:location",
                function (data) {

                    console.log(
                        "Driver location:",
                        data
                    );

                    /*
                     * map.js can use this later
                     * for live driver marker.
                     */

                    window.GoRideDriverLocation =
                        data;
                }
            );


            socket.on(
                "disconnect",
                function () {

                    console.log(
                        "GoRide socket disconnected"
                    );
                }
            );
        }


        /* =====================================================
           STATUS DISPLAY
           ===================================================== */

        function updateStatusText(status) {

            const statusElement =
                document.querySelector(
                    ".status"
                );

            if (!statusElement) return;


            const messages = {

                SEARCHING_DRIVER:
                    "● FINDING DRIVER",

                DRIVER_ASSIGNED:
                    "● DRIVER ASSIGNED",

                DRIVER_ARRIVING:
                    "● DRIVER ARRIVING",

                DRIVER_AT_PICKUP:
                    "● DRIVER AT PICKUP",

                RIDE_STARTED:
                    "● RIDE IN PROGRESS",

                RIDE_COMPLETED:
                    "● RIDE COMPLETED",

                CANCELLED:
                    "● RIDE CANCELLED"
            };


            statusElement.textContent =
                messages[status] ||
                "● LIVE RIDE";
        }


        if (activeRide) {

            updateStatusText(
                activeRide.status
            );
        }


        /* =====================================================
           BACK TO DASHBOARD
           ===================================================== */

        function goDashboard() {

            window.location.href =
                "dashboard.html";
        }

    </script>

</body>
</html>
