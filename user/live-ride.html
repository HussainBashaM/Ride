<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Live Ride — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Top Bar -->
        <div class="topbar">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <span class="status">
                ● LIVE RIDE
            </span>

        </div>

        <!-- Live Ride -->
        <div class="dash-grid">

            <!-- Live Map -->
            <div id="map" class="map">
                <div class="map-badge">
                    ● Driver location updates live
                </div>
            </div>

            <!-- Ride Information -->
            <section class="panel">

                <h2>Finding your driver</h2>

                <p class="muted">
                    Your ride has been sent to nearby available drivers.
                </p>

                <div id="rideInfo"></div>

                <button
                    type="button"
                    class="primary full"
                    onclick="window.location.href='dashboard.html'">
                    Back to Dashboard
                </button>

            </section>

        </div>

    </div>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>
    <script src="../js/map.js"></script>

    <!-- Live Ride Logic -->
    <script>
        const rideInfo =
            document.getElementById("rideInfo");

        const r = JSON.parse(
            localStorage.getItem("goride_active_ride") || "{}"
        );

        function renderRideInfo() {

            rideInfo.innerHTML = `
                <div class="stat">
                    <span>Vehicle</span>
                    <b>${r.vehicleType || "—"}</b>
                </div>

                <div class="stat">
                    <span>Fare</span>
                    <b>₹${r.fare || "—"}</b>
                </div>

                <div class="stat">
                    <span>Status</span>
                    <b>${r.status || "SEARCHING_DRIVER"}</b>
                </div>
            `;
        }

        renderRideInfo();

        if (typeof io === "function") {

            const socket = io();

            socket.on("ride:update", function (x) {

                if (x._id === r._id) {

                    r.status = x.status;

                    localStorage.setItem(
                        "goride_active_ride",
                        JSON.stringify(r)
                    );

                    renderRideInfo();
                }
            });
        }
    </script>

</body>

</html>
