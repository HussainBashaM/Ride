<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Live Ride — GoRide</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5ff;
            color: #20202a;
            font-family: Arial, sans-serif;
        }

        .live-app {
            width: 100%;
            max-width: 700px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .live-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: white;
        }

        .brand {
            text-decoration: none;
            color: #222;
            font-size: 26px;
            font-weight: 800;
        }

        .brand span {
            color: #7c3aed;
        }

        .live-badge {
            padding: 8px 12px;
            border-radius: 20px;
            background: #e9f9ef;
            color: #188044;
            font-size: 12px;
            font-weight: 700;
        }

        .status-card {
            margin: 16px;
            padding: 20px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .status-label {
            color: #777;
            font-size: 12px;
            margin-bottom: 6px;
        }

        #rideStatus {
            margin: 0;
            color: #6d28d9;
            font-size: 23px;
        }

        #statusMessage {
            margin: 8px 0 0;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .map-wrap {
            margin: 16px;
            overflow: hidden;
            border-radius: 22px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .10);
        }

        #map {
            width: 100%;
            height: 350px;
            position: relative;
        }

        .map-badge {
            position: absolute;
            z-index: 500;
            top: 14px;
            left: 14px;
            padding: 9px 13px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 4px 15px rgba(0,0,0,.12);
            font-size: 12px;
            font-weight: 600;
        }

        .ride-card {
            margin: 16px;
            padding: 20px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .ride-title {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .location {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .dot {
            width: 12px;
            height: 12px;
            margin-top: 5px;
            border-radius: 50%;
            background: #22a95a;
            flex-shrink: 0;
        }

        .dot.destination {
            background: #7c3aed;
        }

        .location small {
            display: block;
            color: #777;
            margin-bottom: 4px;
        }

        .location strong {
            display: block;
            font-size: 14px;
            line-height: 1.4;
        }

        .details {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 8px;
            padding: 14px;
            margin-top: 5px;
            border-radius: 16px;
            background: #f7f6fa;
            text-align: center;
        }

        .details span {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .details b {
            font-size: 15px;
        }

        .driver-card {
            margin: 16px;
            padding: 18px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .driver-title {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .driver-message {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .actions {
            margin: 16px;
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .primary-btn {
            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );
            color: white;
        }

        .danger-btn {
            background: #ffe9e9;
            color: #c62828;
        }

        .secondary-btn {
            background: #eee8ff;
            color: #6d28d9;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 380px) {

            .details {
                grid-template-columns: 1fr;
            }

            #map {
                height: 300px;
            }
        }

    </style>

</head>

<body>

<div class="live-app">

    <header class="live-topbar">

        <a
            class="brand"
            href="../index.html"
        >
            Go<span>Ride</span>
        </a>

        <span
            id="liveBadge"
            class="live-badge"
        >
            ● LIVE
        </span>

    </header>


    <!-- STATUS -->

    <section class="status-card">

        <div class="status-label">
            CURRENT RIDE STATUS
        </div>

        <h2 id="rideStatus">
            Searching for driver...
        </h2>

        <p id="statusMessage">
            Your ride request has been sent
            to nearby drivers.
        </p>

    </section>


    <!-- MAP -->

    <section class="map-wrap">

        <div id="map">

            <div class="map-badge">
                🛵 Driver location updates live
            </div>

        </div>

    </section>


    <!-- RIDE DETAILS -->

    <section class="ride-card">

        <h3 class="ride-title">
            Your Ride
        </h3>


        <div class="location">

            <span class="dot"></span>

            <div>

                <small>
                    Pickup
                </small>

                <strong id="pickup">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="location">

            <span class="dot destination"></span>

            <div>

                <small>
                    Destination
                </small>

                <strong id="destination">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="details">

            <div>

                <span>
                    Vehicle
                </span>

                <b id="vehicle">
                    --
                </b>

            </div>


            <div>

                <span>
                    Distance
                </span>

                <b id="distance">
                    --
                </b>

            </div>


            <div>

                <span>
                    Fare
                </span>

                <b id="fare">
                    ₹--
                </b>

            </div>

        </div>

    </section>


    <!-- DRIVER INFORMATION -->

    <section
        class="driver-card"
        id="driverCard"
    >

        <h3 class="driver-title">
            🛵 Driver
        </h3>

        <p
            id="driverMessage"
            class="driver-message"
        >
            Searching for a nearby driver...
        </p>

    </section>


    <!-- ACTIONS -->

    <section class="actions">

        <button
            id="cancelBtn"
            class="action-btn danger-btn"
            onclick="cancelRide()"
        >
            ❌ Cancel Ride
        </button>


        <button
            class="action-btn secondary-btn"
            onclick="goDashboard()"
        >
            Back to Dashboard
        </button>

    </section>

</div>


<!-- SOCKET.IO -->
    
<!-- =====================================================
     SOCKET.IO
     ===================================================== -->

<script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>

<script src="../js/app.js"></script>
<script src="../js/map.js"></script>


<script>

const API_BASE =
    window.GORIDE_API ||
    window.API_BASE_URL ||
    localStorage.getItem("API_BASE_URL") ||
    "https://ride-f6la.onrender.com";


/* =====================================================
   AUTH HEADERS
   ===================================================== */

function authHeaders() {

    const token =
        localStorage.getItem("token") ||
        localStorage.getItem("goride_token") ||
        "";

    return {
        "Content-Type": "application/json",

        ...(token
            ? {
                Authorization:
                    "Bearer " + token
            }
            : {})
    };
}


/* =====================================================
   ACTIVE RIDE
   ===================================================== */

let activeRide =
    JSON.parse(
        localStorage.getItem(
            "goride_active_ride"
        ) || "null"
    );


/* =====================================================
   SHOW RIDE INFORMATION
   ===================================================== */

function renderRideInfo() {

    if (!activeRide) {

        document.getElementById(
            "pickup"
        ).textContent = "--";

        document.getElementById(
            "destination"
        ).textContent = "--";

        document.getElementById(
            "vehicle"
        ).textContent = "--";

        document.getElementById(
            "distance"
        ).textContent = "--";

        document.getElementById(
            "fare"
        ).textContent = "₹--";

        return;
    }


    document.getElementById(
        "pickup"
    ).textContent =
        activeRide.pickup?.name ||
        "Pickup location";


    document.getElementById(
        "destination"
    ).textContent =
        activeRide.destination?.name ||
        "Destination";


    document.getElementById(
        "vehicle"
    ).textContent =
        activeRide.vehicleType ||
        "--";


    document.getElementById(
        "distance"
    ).textContent =
        activeRide.distance
            ? Number(
                activeRide.distance
            ).toFixed(1) + " km"
            : "--";


    document.getElementById(
        "fare"
    ).textContent =
        activeRide.fare
            ? "₹" +
              Math.round(
                  activeRide.fare
              )
            : "₹--";
}


/* =====================================================
   STATUS DISPLAY
   ===================================================== */

function updateStatusText(status) {

    const statusElement =
        document.getElementById(
            "rideStatus"
        );

    const messageElement =
        document.getElementById(
            "statusMessage"
        );


    if (!statusElement) {
        return;
    }


    const messages = {

        SEARCHING_DRIVER: {
            title:
                "Searching for driver...",
            message:
                "Your ride request has been sent to nearby drivers."
        },

        DRIVER_ASSIGNED: {
            title:
                "Driver assigned",
            message:
                "A driver has accepted your ride."
        },

        DRIVER_ARRIVING: {
            title:
                "Driver is arriving",
            message:
                "Your driver is on the way to the pickup location."
        },

        DRIVER_AT_PICKUP: {
            title:
                "Driver is at pickup",
            message:
                "Your driver has reached the pickup location."
        },

        RIDE_STARTED: {
            title:
                "Ride in progress",
            message:
                "Your ride has started."
        },

        RIDE_COMPLETED: {
            title:
                "Ride completed",
            message:
                "Your ride has been completed successfully."
        },

        CANCELLED: {
            title:
                "Ride cancelled",
            message:
                "This ride has been cancelled."
        }
    };


    const current =
        messages[status] || {

            title:
                "Live Ride",

            message:
                "Ride status is being updated."
        };


    statusElement.textContent =
        current.title;


    if (messageElement) {

        messageElement.textContent =
            current.message;
    }


    /* =================================================
       CANCEL BUTTON
       ================================================= */

    const cancelBtn =
        document.getElementById(
            "cancelBtn"
        );


    if (cancelBtn) {

        if (
            status === "CANCELLED" ||
            status === "RIDE_COMPLETED"
        ) {

            cancelBtn.classList.add(
                "hidden"
            );

        } else {

            cancelBtn.classList.remove(
                "hidden"
            );
        }
    }
}


/* =====================================================
   CANCEL RIDE
   ===================================================== */

async function cancelRide() {

    if (!activeRide || !activeRide._id) {

        alert(
            "No active ride found."
        );

        return;
    }


    if (
        activeRide.status ===
        "RIDE_COMPLETED"
    ) {

        alert(
            "This ride is already completed."
        );

        return;
    }


    if (
        activeRide.status ===
        "CANCELLED"
    ) {

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to cancel this ride?"
        );


    if (!confirmed) {
        return;
    }


    const cancelBtn =
        document.getElementById(
            "cancelBtn"
        );


    if (cancelBtn) {

        cancelBtn.disabled = true;

        cancelBtn.textContent =
            "Cancelling...";
    }


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/rides/" +
                activeRide._id +
                "/status",
                {
                    method: "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            status:
                                "CANCELLED"
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to cancel ride"
            );
        }


        /* =============================================
           UPDATE LOCAL RIDE
           ============================================= */

        activeRide =
            data.ride;


        localStorage.setItem(
            "goride_active_ride",
            JSON.stringify(
                activeRide
            )
        );


        updateStatusText(
            "CANCELLED"
        );


        /*
         * Give Socket.IO time to notify
         * the driver before leaving.
         */

        setTimeout(
            function () {

                localStorage.removeItem(
                    "goride_active_ride"
                );

                window.location.href =
                    "dashboard.html";

            },
            1200
        );


    } catch (error) {

        console.error(
            "Cancel ride error:",
            error
        );


        alert(
            error.message ||
            "Unable to cancel ride."
        );


        if (cancelBtn) {

            cancelBtn.disabled =
                false;

            cancelBtn.textContent =
                "❌ Cancel Ride";
        }
    }
}


/* =====================================================
   SOCKET CONNECTION
   ===================================================== */

let socket = null;


if (
    typeof io === "function"
) {

    socket =
        io(
            API_BASE,
            {
                transports: [
                    "websocket",
                    "polling"
                ]
            }
        );


    /* =================================================
       SOCKET CONNECT
       ================================================= */

    socket.on(
        "connect",
        function () {

            console.log(
                "GoRide passenger socket connected:",
                socket.id
            );


            const user =
                JSON.parse(
                    localStorage.getItem(
                        "user"
                    ) ||
                    localStorage.getItem(
                        "goride_user"
                    ) ||
                    "null"
                );


            const userId =
                user?.id ||
                user?._id;


            if (userId) {

                socket.emit(
                    "join:user",
                    userId
                );
            }
        }
    );


    /* =================================================
       RIDE UPDATE
       ================================================= */

    socket.on(
        "ride:update",
        function (ride) {

            if (!ride || !ride._id) {
                return;
            }


            if (
                !activeRide ||
                String(ride._id) !==
                String(activeRide._id)
            ) {

                return;
            }


            console.log(
                "Passenger ride update:",
                ride
            );


            activeRide =
                ride;


            localStorage.setItem(
                "goride_active_ride",
                JSON.stringify(
                    activeRide
                )
            );


            renderRideInfo();


            updateStatusText(
                ride.status
            );


            /* =========================================
               RIDE COMPLETED
               ========================================= */

            if (
                ride.status ===
                "RIDE_COMPLETED"
            ) {

                setTimeout(
                    function () {

                        localStorage.removeItem(
                            "goride_active_ride"
                        );

                        window.location.href =
                            "ride-history.html";

                    },
                    1500
                );
            }


            /* =========================================
               RIDE CANCELLED
               ========================================= */

            if (
                ride.status ===
                "CANCELLED"
            ) {

                setTimeout(
                    function () {

                        localStorage.removeItem(
                            "goride_active_ride"
                        );

                        window.location.href =
                            "dashboard.html";

                    },
                    1200
                );
            }
        }
    );


    /* =================================================
       DRIVER LOCATION
       ================================================= */

    socket.on(
        "driver:location",
        function (data) {

            console.log(
                "Driver location:",
                data
            );


            window.GoRideDriverLocation =
                data;
        }
    );


    /* =================================================
       SOCKET DISCONNECT
       ================================================= */

    socket.on(
        "disconnect",
        function () {

            console.log(
                "GoRide passenger socket disconnected"
            );
        }
    );
}


/* =====================================================
   BACK TO DASHBOARD
   ===================================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";
}


/* =====================================================
   INITIAL LOAD
   ===================================================== */

renderRideInfo();


if (activeRide) {

    updateStatusText(
        activeRide.status ||
        "SEARCHING_DRIVER"
    );

} else {

    updateStatusText(
        "SEARCHING_DRIVER"
    );
}


/* =====================================================
   PUBLIC FUNCTION
   ===================================================== */

window.cancelRide =
    cancelRide;

window.goDashboard =
    goDashboard;

</script>

</body>
</html>
