<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="dashboard"><div class="topbar"><a class="brand" href="../index.html">Go<span>Ride</span></a><span class="muted">Passenger Dashboard</span></div><div class="dash-grid"><div id="map" class="map"><div class="map-badge">● Live map</div></div><section class="panel"><h2>Book a Ride</h2><label>Pickup</label><input class="input" id="pickup" placeholder="Enter pickup location" oninput="estimate()"><label>Destination</label><input class="input" id="destination" placeholder="Where are you going?" oninput="estimate()"><h3>Choose vehicle</h3><div class="vehicle"><button class="active" onclick="selectVehicle('Bike',this)">🛵<br>Bike</button><button onclick="selectVehicle('Auto',this)">🛺<br>Auto</button><button onclick="selectVehicle('Car',this)">🚗<br>Car</button></div><div class="stat"><span>Distance</span><b id="distance">--</b></div><div class="stat"><span>ETA</span><b id="time">--</b></div><div class="stat"><span>Estimated fare</span><b id="fare">--</b></div><button class="primary full" onclick="confirmRide()">Confirm Ride</button></section></div></div><script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script><script src="../js/app.js"></script><script src="../js/booking.js"></script><script src="../js/map.js"></script></body></html>
