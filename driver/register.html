<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Driver — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><form class="form-card" id="form"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>Become a Driver</h1><input class="input" id="name" placeholder="Full name" required><input class="input" id="email" placeholder="Email"><input class="input" id="phone" placeholder="Phone"><input class="input" id="password" type="password" placeholder="Password" required><input class="input" id="licenceNumber" placeholder="Driving licence number" required><select class="input" id="vehicleType"><option>Bike</option><option>Auto</option><option>Car</option></select><input class="input" id="vehicleModel" placeholder="Vehicle model" required><input class="input" id="vehicleNumber" placeholder="Vehicle registration number" required><button class="primary">Register as Driver</button><p id="msg"></p></form></div><script src="../js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const body={name:name.value,email:email.value||undefined,phone:phone.value||undefined,password:password.value,licenceNumber:licenceNumber.value,vehicleType:vehicleType.value,vehicleModel:vehicleModel.value,vehicleNumber:vehicleNumber.value};const d=await postJSON("/api/drivers/register",body);if(d.success){saveAuth(d);location.href="dashboard.html"}else msg.textContent=d.message||"Registration failed"}</script></body></html>
