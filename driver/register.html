<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Become a Driver — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="form">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Become a Driver</h1>

            <input
                class="input"
                id="name"
                type="text"
                placeholder="Full name"
                required
            >

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                class="input"
                id="phone"
                type="tel"
                placeholder="Phone"
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <input
                class="input"
                id="licenceNumber"
                type="text"
                placeholder="Driving licence number"
                required
            >

            <select
                class="input"
                id="vehicleType"
                required>
                <option value="Bike">Bike</option>
                <option value="Auto">Auto</option>
                <option value="Car">Car</option>
            </select>

            <input
                class="input"
                id="vehicleModel"
                type="text"
                placeholder="Vehicle model"
                required
            >

            <input
                class="input"
                id="vehicleNumber"
                type="text"
                placeholder="Vehicle registration number"
                required
            >

            <button
                type="submit"
                class="primary">
                Register as Driver
            </button>

            <p id="msg"></p>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        const registerForm =
            document.getElementById("form");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const phoneInput =
            document.getElementById("phone");

        const passwordInput =
            document.getElementById("password");

        const licenceInput =
            document.getElementById("licenceNumber");

        const vehicleTypeInput =
            document.getElementById("vehicleType");

        const vehicleModelInput =
            document.getElementById("vehicleModel");

        const vehicleNumberInput =
            document.getElementById("vehicleNumber");

        const message =
            document.getElementById("msg");

        registerForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                message.textContent =
                    "Registering driver...";

                const body = {
                    name: nameInput.value.trim(),

                    email:
                        emailInput.value.trim() ||
                        undefined,

                    phone:
                        phoneInput.value.trim() ||
                        undefined,

                    password:
                        passwordInput.value,

                    licenceNumber:
                        licenceInput.value.trim(),

                    vehicleType:
                        vehicleTypeInput.value,

                    vehicleModel:
                        vehicleModelInput.value.trim(),

                    vehicleNumber:
                        vehicleNumberInput.value.trim()
                };

                try {

                    const data = await postJSON(
                        "/api/drivers/register",
                        body
                    );

                    if (data.success) {

                        saveAuth(data);

                        window.location.href =
                            "dashboard.html";

                    } else {

                        message.textContent =
                            data.message ||
                            "Registration failed";

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );
    </script>

</body>

</html>
