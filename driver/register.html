<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Become a Driver — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="form-page">

        <form class="form-card" id="form">

            <a class="brand" href="../index.html">
                Go<span>Ride</span>
            </a>

            <h1>Become a Driver</h1>

            <input
                class="input"
                id="name"
                type="text"
                placeholder="Full name"
                required
            >

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                class="input"
                id="phone"
                type="tel"
                placeholder="Phone"
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <input
                class="input"
                id="licenceNumber"
                type="text"
                placeholder="Driving licence number"
                required
            >

            <select
                class="input"
                id="vehicleType"
                required>
                <option value="Bike">Bike</option>
                <option value="Auto">Auto</option>
                <option value="Car">Car</option>
            </select>

            <input
                class="input"
                id="vehicleModel"
                type="text"
                placeholder="Vehicle model"
                required
            >

            <input
                class="input"
                id="vehicleNumber"
                type="text"
                placeholder="Vehicle registration number"
                required
            >

            <button
                type="submit"
                class="primary">
                Register as Driver
            </button>

            <p id="msg"></p>

        </form>

    </div>

    <!-- GoRide JavaScript -->
    <script src="../js/app.js"></script>
<script>
    const registerForm = document.getElementById("form");

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const passwordInput = document.getElementById("password");
    const licenceInput = document.getElementById("licenceNumber");
    const vehicleTypeInput = document.getElementById("vehicleType");
    const vehicleModelInput = document.getElementById("vehicleModel");
    const vehicleNumberInput = document.getElementById("vehicleNumber");
    const message = document.getElementById("msg");

    const API_BASE = "https://ride-f6la.onrender.com";

    registerForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        message.textContent = "Registering driver...";

        try {

            const response = await fetch(
                API_BASE + "/api/drivers/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: nameInput.value.trim(),

                        email:
                            emailInput.value.trim() ||
                            undefined,

                        phone:
                            phoneInput.value.trim() ||
                            undefined,

                        password:
                            passwordInput.value,

                        licenceNumber:
                            licenceInput.value.trim(),

                        vehicleType:
                            vehicleTypeInput.value,

                        vehicleModel:
                            vehicleModelInput.value.trim(),

                        vehicleNumber:
                            vehicleNumberInput.value.trim()
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Driver registration failed"
                );
            }

            if (data.success) {

                const receivedToken =
                    data.token ||
                    data.accessToken ||
                    data.jwt;

                const receivedUser =
                    data.user ||
                    data.data?.user ||
                    data.account;

                if (receivedToken) {
                    localStorage.setItem(
                        "token",
                        receivedToken
                    );

                    localStorage.setItem(
                        "goride_token",
                        receivedToken
                    );
                }

                if (receivedUser) {
                    localStorage.setItem(
                        "user",
                        JSON.stringify(receivedUser)
                    );

                    localStorage.setItem(
                        "goride_user",
                        JSON.stringify(receivedUser)
                    );
                }

                localStorage.setItem(
                    "goride_role",
                    "driver"
                );

                message.textContent =
                    "Driver account created successfully!";

                setTimeout(function () {
                    window.location.href =
                        "dashboard.html";
                }, 500);

            } else {

                message.textContent =
                    data.message ||
                    "Driver registration failed";
            }

        } catch (error) {

            console.error(
                "Driver registration error:",
                error
            );

            message.textContent =
                error.message ||
                "Unable to connect to server.";
        }

    });
</script>
    

</body>

</html>
