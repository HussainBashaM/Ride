<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Login — GoRide</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><form class="form-card" id="form"><a class="brand" href="../index.html">Go<span>Ride</span></a><h1>Driver Login</h1><input class="input" id="identity" placeholder="Email or phone" required><input class="input" id="password" type="password" placeholder="Password" required><button class="primary">Login</button><p class="muted">New driver? <a class="link" href="register.html">Become a Driver</a></p><p id="msg"></p></form></div><script src="../js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const v=identity.value;const d=await postJSON("/api/auth/login",{email:v.includes("@")?v:undefined,phone:v.includes("@")?undefined:v,password:password.value,role:"driver"});if(d.success){saveAuth(d);location.href="dashboard.html"}else msg.textContent=d.message||"Login failed"}</script></body></html>
