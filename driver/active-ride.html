<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Active Ride — GoRide</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5ff;
            color: #20202a;
            font-family: Arial, sans-serif;
        }

        .active-app {
            width: 100%;
            max-width: 700px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: white;
        }

        .brand {
            text-decoration: none;
            color: #222;
            font-size: 26px;
            font-weight: 800;
        }

        .brand span {
            color: #7c3aed;
        }

        .live-badge {
            padding: 8px 12px;
            border-radius: 20px;
            background: #e9f9ef;
            color: #188044;
            font-size: 12px;
            font-weight: 700;
        }

        .status-card,
        .ride-card,
        .driver-card {
            margin: 16px;
            padding: 20px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .08);
        }

        .status-label {
            color: #777;
            font-size: 12px;
            margin-bottom: 7px;
        }

        #rideStatus {
            margin: 0;
            color: #6d28d9;
            font-size: 23px;
        }

        #statusMessage {
            margin: 8px 0 0;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .map-wrap {
            margin: 16px;
            overflow: hidden;
            border-radius: 22px;
            background: white;
            box-shadow:
                0 8px 25px rgba(80, 50, 130, .10);
        }

        #map {
            width: 100%;
            height: 350px;
        }

        .map-badge {
            position: absolute;
            z-index: 500;
            margin: 14px;
            padding: 9px 13px;
            border-radius: 20px;
            background: white;
            box-shadow:
                0 4px 15px rgba(0,0,0,.12);
            font-size: 12px;
            font-weight: 600;
        }

        .ride-title,
        .driver-title {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .location {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .dot {
            width: 12px;
            height: 12px;
            margin-top: 5px;
            border-radius: 50%;
            background: #22a95a;
            flex-shrink: 0;
        }

        .destination-dot {
            background: #7c3aed;
        }

        .location small {
            display: block;
            color: #777;
            margin-bottom: 4px;
        }

        .location strong {
            display: block;
            font-size: 14px;
            line-height: 1.4;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 14px;
            margin-top: 5px;
            border-radius: 16px;
            background: #f7f6fa;
            text-align: center;
        }

        .details span {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .details b {
            font-size: 15px;
        }

        .driver-message {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .actions {
            margin: 16px;
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn {
            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );
            color: white;
        }

        .secondary-btn {
            background: #eee8ff;
            color: #6d28d9;
        }

        .danger-btn {
            background: #ffe9e9;
            color: #c62828;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 380px) {

            .details {
                grid-template-columns: 1fr;
            }

            #map {
                height: 300px;
            }

        }

    </style>

</head>

<body>

<div class="active-app">

    <!-- TOP BAR -->

    <header class="topbar">

        <a
            class="brand"
            href="../index.html"
        >
            Go<span>Ride</span>
        </a>

        <span class="live-badge">
            ● ACTIVE RIDE
        </span>

    </header>


    <!-- STATUS -->

    <section class="status-card">

        <div class="status-label">
            CURRENT RIDE STATUS
        </div>

        <h2 id="rideStatus">
            Loading ride...
        </h2>

        <p id="statusMessage">
            Loading ride information...
        </p>

    </section>


    <!-- MAP -->

    <section class="map-wrap">

        <div id="map">

            <div class="map-badge">
                📍 Live ride map
            </div>

        </div>

    </section>


    <!-- PASSENGER RIDE -->

    <section class="ride-card">

        <h3 class="ride-title">
            Passenger Ride
        </h3>


        <div class="location">

            <span class="dot"></span>

            <div>

                <small>
                    Pickup
                </small>

                <strong id="pickup">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="location">

            <span class="dot destination-dot"></span>

            <div>

                <small>
                    Destination
                </small>

                <strong id="destination">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="details">

            <div>

                <span>
                    Vehicle
                </span>

                <b id="vehicle">
                    --
                </b>

            </div>


            <div>

                <span>
                    Distance
                </span>

                <b id="distance">
                    --
                </b>

            </div>


            <div>

                <span>
                    Fare
                </span>

                <b id="fare">
                    ₹--
                </b>

            </div>

        </div>

    </section>


    <!-- DRIVER ACTIONS -->

    <section class="driver-card">

        <h3 class="driver-title">
            Ride Controls
        </h3>

        <p
            id="driverMessage"
            class="driver-message"
        >
            You have accepted this ride.
        </p>

    </section>


    <section class="actions">

        <button
            type="button"
            class="action-btn primary-btn"
            onclick="updateRideStatus('DRIVER_ARRIVING')"
        >
            🚗 Driver Arriving
        </button>


        <button
            type="button"
            class="action-btn primary-btn"
            onclick="updateRideStatus('DRIVER_AT_PICKUP')"
        >
            📍 Driver Arrived
        </button>


        <button
            type="button"
            class="action-btn primary-btn"
            onclick="updateRideStatus('RIDE_STARTED')"
        >
            ▶️ Start Ride
        </button>


        <button
            type="button"
            class="action-btn primary-btn"
            onclick="updateRideStatus('RIDE_COMPLETED')"
        >
            ✅ Complete Ride
        </button>


        <button
            type="button"
            class="action-btn danger-btn"
            onclick="driverCancelRide()"
        >
            ❌ Cancel Ride
        </button>


        <button
            type="button"
            class="action-btn secondary-btn"
            onclick="goDriverDashboard()"
        >
            ← Back to Dashboard
        </button>

    </section>

</div>


<!-- SOCKET.IO -->

<script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>


<!-- GoRide JS -->

<script src="../js/app.js"></script>

<script src="../js/map.js"></script>

<script src="../js/driver.js"></script>


<script>

    /* =====================================================
       ACTIVE RIDE
       ===================================================== */

    let activeRide =
        JSON.parse(
            localStorage.getItem(
                "driver_active_ride"
            ) || "null"
        );


    /* =====================================================
       LOAD RIDE
       ===================================================== */

    function loadRide() {

        if (!activeRide) {

            document.getElementById(
                "rideStatus"
            ).textContent =
                "No active ride";

            document.getElementById(
                "statusMessage"
            ).textContent =
                "No active ride was found.";

            return;
        }


        document.getElementById(
            "pickup"
        ).textContent =
            activeRide.pickup?.name ||
            "Pickup location";


        document.getElementById(
            "destination"
        ).textContent =
            activeRide.destination?.name ||
            "Destination";


        document.getElementById(
            "vehicle"
        ).textContent =
            activeRide.vehicleType ||
            "--";


        document.getElementById(
            "distance"
        ).textContent =
            activeRide.distance
                ? Number(activeRide.distance).toFixed(1) + " km"
                : "--";


        document.getElementById(
            "fare"
        ).textContent =
            activeRide.fare
                ? "₹" + Math.round(activeRide.fare)
                : "₹--";


        updatePageStatus(
            activeRide.status
        );
    }


    /* =====================================================
       STATUS TEXT
       ===================================================== */

    function updatePageStatus(status) {

        const title =
            document.getElementById(
                "rideStatus"
            );

        const message =
            document.getElementById(
                "statusMessage"
            );


        const statusMap = {

            DRIVER_ASSIGNED: [
                "Ride Accepted",
                "Passenger has been notified."
            ],

            DRIVER_ARRIVING: [
                "Driver Arriving",
                "Go to the passenger pickup location."
            ],

            DRIVER_AT_PICKUP: [
                "Driver Arrived",
                "You have reached the pickup location."
            ],

            RIDE_STARTED: [
                "Ride In Progress",
                "Take the passenger to the destination."
            ],

            RIDE_COMPLETED: [
                "Ride Completed",
                "This ride has been completed."
            ],

            CANCELLED: [
                "Ride Cancelled",
                "This ride has been cancelled."
            ]

        };


        const info =
            statusMap[status] ||
            [
                "Active Ride",
                "Ride is currently active."
            ];


        title.textContent =
            info[0];

        message.textContent =
            info[1];
    }


    loadRide();


    /* =====================================================
       SOCKET CONNECTION
       ===================================================== */

    const API_BASE =
        window.GORIDE_API ||
        window.API_BASE_URL ||
        localStorage.getItem(
            "API_BASE_URL"
        ) ||
        "https://ride-f6la.onrender.com";


    if (
        typeof io === "function"
    ) {

        const socket =
            io(API_BASE, {
                transports: [
                    "websocket",
                    "polling"
                ]
            });


        socket.on(
            "connect",
            function () {

                const user =
                    JSON.parse(
                        localStorage.getItem(
                            "user"
                        ) ||
                        localStorage.getItem(
                            "goride_user"
                        ) ||
                        "null"
                    );


                const driverId =
                    user?.id ||
                    user?._id;


                if (driverId) {

                    socket.emit(
                        "join:driver",
                        driverId
                    );

                }

            }
        );


        socket.on(
            "ride:update",
            function (ride) {

                if (!activeRide) {
                    return;
                }


                if (
                    String(ride._id) !==
                    String(activeRide._id)
                ) {
                    return;
                }


                activeRide =
                    ride;


                localStorage.setItem(
                    "driver_active_ride",
                    JSON.stringify(
                        activeRide
                    )
                );


                loadRide();

            }
        );

    }


    /* =====================================================
       BACK TO DRIVER DASHBOARD
       ===================================================== */

    function goDriverDashboard() {

        window.location.href =
            "dashboard.html";

    }


    /* =====================================================
       DRIVER CANCEL
       ===================================================== */

    async function driverCancelRide() {

        if (!activeRide) {

            alert(
                "No active ride."
            );

            return;
        }


        const confirmCancel =
            confirm(
                "Are you sure you want to cancel this ride?"
            );


        if (!confirmCancel) {
            return;
        }


        /*
         * The server-side driver cancellation
         * will be connected in the next step.
         */

        alert(
            "Driver cancellation will be enabled in the next server update."
        );

    }

</script>

</body>

    </html>
