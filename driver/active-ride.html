<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Active Ride — GoRide</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f5ff;
            color: #20202a;
            font-family: Arial, sans-serif;
        }

        .active-app {
            width: 100%;
            max-width: 520px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: white;
        }

        .brand {
            text-decoration: none;
            color: #222;
            font-size: 26px;
            font-weight: 800;
        }

        .brand span {
            color: #7c3aed;
        }

        .back-btn {
            border: 0;
            background: #eee8ff;
            color: #6d28d9;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .status-card {
            margin: 16px;
            padding: 18px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 25px rgba(80, 50, 130, .08);
        }

        .status-label {
            color: #777;
            font-size: 12px;
            margin-bottom: 6px;
        }

        #rideStatus {
            margin: 0;
            color: #6d28d9;
            font-size: 22px;
        }

        .map-wrap {
            margin: 16px;
            overflow: hidden;
            border-radius: 22px;
            background: white;
            box-shadow: 0 8px 25px rgba(80, 50, 130, .10);
        }

        #map {
            width: 100%;
            height: 300px;
        }

        .ride-card {
            margin: 16px;
            padding: 18px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 25px rgba(80, 50, 130, .08);
        }

        .ride-title {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .location {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .dot {
            width: 12px;
            height: 12px;
            margin-top: 5px;
            border-radius: 50%;
            background: #22a95a;
            flex-shrink: 0;
        }

        .dot.destination {
            background: #7c3aed;
        }

        .location small {
            display: block;
            color: #777;
            margin-bottom: 4px;
        }

        .location strong {
            display: block;
            font-size: 14px;
            line-height: 1.4;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 14px;
            margin-top: 5px;
            border-radius: 16px;
            background: #f7f6fa;
            text-align: center;
        }

        .details span {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .details b {
            font-size: 15px;
        }

        .actions {
            margin: 16px;
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn {
            background: linear-gradient(
                135deg,
                #6d28d9,
                #8b5cf6
            );
            color: white;
        }

        .secondary-btn {
            background: #eee8ff;
            color: #6d28d9;
        }

        .danger-btn {
            background: #ffe9e9;
            color: #c62828;
        }

        .complete-btn {
            background: #e7f8ed;
            color: #188044;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 35px 20px;
            color: #777;
        }

        @media (max-width: 380px) {
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="active-app">

    <header class="topbar">

        <a
            class="brand"
            href="../index.html">
            Go<span>Ride</span>
        </a>

        <button
            class="back-btn"
            onclick="goDashboard()">
            Dashboard
        </button>

    </header>


    <!-- RIDE STATUS -->

    <section class="status-card">

        <div class="status-label">
            CURRENT RIDE STATUS
        </div>

        <h2 id="rideStatus">
            Loading ride...
        </h2>

    </section>


    <!-- MAP -->

    <section class="map-wrap">

        <div id="map"></div>

    </section>


    <!-- RIDE DETAILS -->

    <section
        class="ride-card"
        id="rideCard">

        <h3 class="ride-title">
            Passenger Ride
        </h3>


        <div class="location">

            <span class="dot"></span>

            <div>

                <small>
                    Pickup
                </small>

                <strong id="pickup">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="location">

            <span class="dot destination"></span>

            <div>

                <small>
                    Destination
                </small>

                <strong id="destination">
                    Loading...
                </strong>

            </div>

        </div>


        <div class="details">

            <div>

                <span>
                    Vehicle
                </span>

                <b id="vehicle">
                    --
                </b>

            </div>


            <div>

                <span>
                    Distance
                </span>

                <b id="distance">
                    --
                </b>

            </div>


            <div>

                <span>
                    Fare
                </span>

                <b id="fare">
                    ₹--
                </b>

            </div>

        </div>

    </section>


    <!-- ACTION BUTTONS -->

    <section class="actions">

        <button
            id="arrivingBtn"
            class="action-btn primary-btn"
            onclick="changeRideStatus('DRIVER_ARRIVING')">

            🚗 Driver Arriving

        </button>


        <button
            id="pickupBtn"
            class="action-btn secondary-btn hidden"
            onclick="changeRideStatus('DRIVER_AT_PICKUP')">

            📍 Arrived at Pickup

        </button>


        <button
            id="startBtn"
            class="action-btn primary-btn hidden"
            onclick="changeRideStatus('RIDE_STARTED')">

            ▶️ Start Ride

        </button>


        <button
            id="completeBtn"
            class="action-btn complete-btn hidden"
            onclick="changeRideStatus('RIDE_COMPLETED')">

            ✅ Complete Ride

        </button>


        <button
            id="cancelBtn"
            class="action-btn danger-btn"
            onclick="changeRideStatus('CANCELLED')">

            ❌ Cancel Ride

        </button>

    </section>

</div>


<script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>

<script src="../js/app.js"></script>
<script src="../js/driver.js"></script>

<script>
/* =========================================================
   GoRide DRIVER ACTIVE RIDE
   Active ride logic + map + live driver location
   ========================================================= */

const API_BASE =
    window.GORIDE_API ||
    window.API_BASE_URL ||
    localStorage.getItem("API_BASE_URL") ||
    "https://ride-f6la.onrender.com";

let activeRide = null;
let activeMap = null;
let driverMarker = null;
let pickupMarker = null;
let destinationMarker = null;
let routeLine = null;


/* =========================================================
   AUTH
   ========================================================= */

function getToken() {

    return (
        localStorage.getItem("token") ||
        localStorage.getItem("goride_token") ||
        ""
    );
}


function authHeaders() {

    const headers = {
        "Content-Type": "application/json"
    };

    const token = getToken();

    if (token) {
        headers.Authorization =
            "Bearer " + token;
    }

    return headers;
}


/* =========================================================
   LOAD ACTIVE RIDE
   ========================================================= */

function loadActiveRide() {

    try {

        activeRide =
            JSON.parse(
                localStorage.getItem(
                    "driver_active_ride"
                ) || "null"
            );

    } catch (error) {

        activeRide = null;
    }


    if (!activeRide) {

        document.getElementById(
            "rideStatus"
        ).textContent =
            "No active ride";

        document.getElementById(
            "rideCard"
        ).innerHTML = `
            <div class="loading">
                No active ride found.
            </div>
        `;

        hideAllButtons();

        return;
    }


    updateRideUI();

    initializeRideMap();
}


/* =========================================================
   UPDATE RIDE UI
   ========================================================= */

function updateRideUI() {

    if (!activeRide) return;


    const status =
        activeRide.status ||
        "DRIVER_ASSIGNED";


    const statusText = {

        SEARCHING_DRIVER:
            "Searching for driver",

        DRIVER_ASSIGNED:
            "Ride accepted",

        DRIVER_ARRIVING:
            "Driver is arriving",

        DRIVER_AT_PICKUP:
            "Arrived at pickup",

        RIDE_STARTED:
            "Ride in progress",

        RIDE_COMPLETED:
            "Ride completed",

        CANCELLED:
            "Ride cancelled"
    };


    const statusElement =
        document.getElementById(
            "rideStatus"
        );


    if (statusElement) {

        statusElement.textContent =
            statusText[status] ||
            status.replaceAll("_", " ");
    }


    const pickup =
        document.getElementById(
            "pickup"
        );

    const destination =
        document.getElementById(
            "destination"
        );

    const vehicle =
        document.getElementById(
            "vehicle"
        );

    const distance =
        document.getElementById(
            "distance"
        );

    const fare =
        document.getElementById(
            "fare"
        );


    if (pickup) {

        pickup.textContent =
            activeRide.pickup?.name ||
            "Pickup location";
    }


    if (destination) {

        destination.textContent =
            activeRide.destination?.name ||
            "Destination";
    }


    if (vehicle) {

        vehicle.textContent =
            activeRide.vehicleType ||
            "--";
    }


    if (distance) {

        distance.textContent =
            Number(
                activeRide.distance || 0
            ).toFixed(1) +
            " km";
    }


    if (fare) {

        fare.textContent =
            "₹" +
            Math.round(
                activeRide.fare || 0
            );
    }


    updateButtons(status);
}


/* =========================================================
   BUTTON VISIBILITY
   ========================================================= */

function hideAllButtons() {

    [
        "arrivingBtn",
        "pickupBtn",
        "startBtn",
        "completeBtn",
        "cancelBtn"
    ].forEach(function (id) {

        const button =
            document.getElementById(id);

        if (button) {
            button.classList.add("hidden");
        }
    });
}


function updateButtons(status) {

    hideAllButtons();


    if (
        status === "DRIVER_ASSIGNED"
    ) {

        document
            .getElementById("arrivingBtn")
            ?.classList.remove("hidden");

        document
            .getElementById("cancelBtn")
            ?.classList.remove("hidden");

        return;
    }


    if (
        status === "DRIVER_ARRIVING"
    ) {

        document
            .getElementById("pickupBtn")
            ?.classList.remove("hidden");

        document
            .getElementById("cancelBtn")
            ?.classList.remove("hidden");

        return;
    }


    if (
        status === "DRIVER_AT_PICKUP"
    ) {

        document
            .getElementById("startBtn")
            ?.classList.remove("hidden");

        document
            .getElementById("cancelBtn")
            ?.classList.remove("hidden");

        return;
    }


    if (
        status === "RIDE_STARTED"
    ) {

        document
            .getElementById("completeBtn")
            ?.classList.remove("hidden");

        return;
    }
}


/* =========================================================
   CHANGE RIDE STATUS
   ========================================================= */

async function changeRideStatus(status) {

    if (!activeRide?._id) {

        alert("No active ride found.");

        return;
    }


    const button =
        event?.currentTarget;


    if (button) {
        button.disabled = true;
    }


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/rides/" +
                activeRide._id +
                "/status",
                {
                    method: "POST",
                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            status: status
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to update ride"
            );
        }


        activeRide =
            data.ride;


        localStorage.setItem(
            "driver_active_ride",
            JSON.stringify(
                activeRide
            )
        );


        updateRideUI();


        if (
            status ===
            "RIDE_COMPLETED"
        ) {

            alert(
                "Ride completed successfully!"
            );

            setTimeout(
                function () {

                    window.location.href =
                        "driver-dashboard.html";

                },
                500
            );

            return;
        }


        if (
            status ===
            "CANCELLED"
        ) {

            localStorage.removeItem(
                "driver_active_ride"
            );

            alert(
                "Ride cancelled."
            );

            window.location.href =
                "driver-dashboard.html";

            return;
        }


    } catch (error) {

        console.error(
            "Ride status error:",
            error
        );

        alert(
            error.message ||
            "Unable to update ride."
        );

        if (button) {
            button.disabled = false;
        }
    }
}


/* =========================================================
   LOAD LEAFLET
   ========================================================= */

function loadLeaflet() {

    return new Promise(
        function (resolve, reject) {

            if (window.L) {

                resolve();

                return;
            }


            const css =
                document.createElement(
                    "link"
                );

            css.rel =
                "stylesheet";

            css.href =
                "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

            document.head.appendChild(
                css
            );


            const script =
                document.createElement(
                    "script"
                );

            script.src =
                "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";


            script.onload =
                resolve;


            script.onerror =
                function () {

                    reject(
                        new Error(
                            "Map library failed to load"
                        )
                    );
                };


            document.head.appendChild(
                script
            );
        }
    );
}


/* =========================================================
   INITIALIZE RIDE MAP
   ========================================================= */

async function initializeRideMap() {

    const mapElement =
        document.getElementById(
            "map"
        );


    if (!mapElement ||
        !activeRide) {

        return;
    }


    try {

        await loadLeaflet();


        if (activeMap) {

            activeMap.invalidateSize();

            return;
        }


        let center =
            [20.5937, 78.9629];


        if (
            activeRide.pickup?.lat &&
            activeRide.pickup?.lng
        ) {

            center = [
                Number(activeRide.pickup.lat),
                Number(activeRide.pickup.lng)
            ];
        }


        activeMap =
            L.map("map")
            .setView(
                center,
                14
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(activeMap);


        addRideMarkers();

        drawRideRoute();


        /*
         * Start driver's live GPS.
         */

        startDriverLocation();


    } catch (error) {

        console.error(
            "Active ride map error:",
            error
        );
    }
}


/* =========================================================
   RIDE MARKERS
   ========================================================= */

function addRideMarkers() {

    if (!activeMap) return;


    const pickup =
        activeRide.pickup;


    const destination =
        activeRide.destination;


    if (
        pickup?.lat &&
        pickup?.lng
    ) {

        pickupMarker =
            L.marker([
                Number(pickup.lat),
                Number(pickup.lng)
            ])
            .addTo(activeMap)
            .bindPopup(
                "📍 Passenger Pickup"
            );
    }


    if (
        destination?.lat &&
        destination?.lng
    ) {

        destinationMarker =
            L.marker([
                Number(destination.lat),
                Number(destination.lng)
            ])
            .addTo(activeMap)
            .bindPopup(
                "🏁 Destination"
            );
    }


    fitRideLocations();
}


/* =========================================================
   FIT MAP
   ========================================================= */

function fitRideLocations() {

    const points = [];


    if (
        activeRide?.pickup?.lat &&
        activeRide?.pickup?.lng
    ) {

        points.push([
            Number(activeRide.pickup.lat),
            Number(activeRide.pickup.lng)
        ]);
    }


    if (
        activeRide?.destination?.lat &&
        activeRide?.destination?.lng
    ) {

        points.push([
            Number(activeRide.destination.lat),
            Number(activeRide.destination.lng)
        ]);
    }


    if (
        activeMap &&
        points.length
    ) {

        activeMap.fitBounds(
            L.latLngBounds(points),
            {
                padding: [35, 35]
            }
        );
    }
}


/* =========================================================
   DRAW ROUTE
   ========================================================= */

async function drawRideRoute() {

    if (
        !activeRide?.pickup?.lat ||
        !activeRide?.pickup?.lng ||
        !activeRide?.destination?.lat ||
        !activeRide?.destination?.lng
    ) {

        return;
    }


    try {

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            Number(activeRide.pickup.lng) +
            "," +
            Number(activeRide.pickup.lat) +
            ";" +
            Number(activeRide.destination.lng) +
            "," +
            Number(activeRide.destination.lat) +
            "?overview=full&geometries=geojson";


        const response =
            await fetch(url);


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        if (
            !data.routes ||
            !data.routes.length
        ) {

            return;
        }


        if (routeLine) {

            activeMap.removeLayer(
                routeLine
            );
        }


        routeLine =
            L.geoJSON(
                data.routes[0].geometry,
                {
                    style: {
                        weight: 5,
                        opacity: .85
                    }
                }
            ).addTo(activeMap);

    } catch (error) {

        console.error(
            "Active ride route error:",
            error
        );
    }
}


/* =========================================================
   DRIVER LIVE LOCATION
   ========================================================= */

function startDriverLocation() {

    if (!navigator.geolocation) {

        console.warn(
            "Geolocation not supported"
        );

        return;
    }


    navigator.geolocation.watchPosition(

        function (position) {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            updateDriverMarker(
                lat,
                lng
            );


            /*
             * Send driver location
             * to backend through Socket.IO.
             */

            if (
                window.GoRideDriverSocket
            ) {

                window.GoRideDriverSocket.emit(
                    "driver:location",
                    {
                        driverId:
                            getDriverIdForLocation(),

                        rideId:
                            activeRide?._id,

                        lat: lat,
                        lng: lng
                    }
                );
            }
        },

        function (error) {

            console.warn(
                "Driver GPS error:",
                error.message
            );
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 5000
        }
    );
}


/* =========================================================
   DRIVER MARKER
   ========================================================= */

function updateDriverMarker(
    lat,
    lng
) {

    if (!activeMap) return;


    if (driverMarker) {

        driverMarker.setLatLng([
            lat,
            lng
        ]);

    } else {

        driverMarker =
            L.marker([
                lat,
                lng
            ])
            .addTo(activeMap)
            .bindPopup(
                "🛵 Your location"
            );
    }
}


/* =========================================================
   DRIVER ID
   ========================================================= */

function getDriverIdForLocation() {

    try {

        const user =
            JSON.parse(
                localStorage.getItem("user") ||
                localStorage.getItem("goride_user") ||
                "null"
            );


        return (
            user?.id ||
            user?._id ||
            null
        );

    } catch {

        return null;
    }
}


/* =========================================================
   DASHBOARD
   ========================================================= */

function goDashboard() {

    window.location.href =
        "driver-dashboard.html";
}


/* =========================================================
   SOCKET SETUP
   ========================================================= */

function setupActiveRideSocket() {

    if (
        typeof io !== "function"
    ) {

        return;
    }


    const socket =
        io(API_BASE);


    window.GoRideDriverSocket =
        socket;


    const driverId =
        getDriverIdForLocation();


    if (driverId) {

        socket.emit(
            "join:driver",
            driverId
        );
    }


    socket.on(
        "ride:update",
        function (ride) {

            if (
                !activeRide ||
                ride._id !==
                activeRide._id
            ) {

                return;
            }


            activeRide =
                ride;


            localStorage.setItem(
                "driver_active_ride",
                JSON.stringify(
                    activeRide
                )
            );


            updateRideUI();
        }
    );


    socket.on(
        "connect",
        function () {

            console.log(
                "GoRide active ride socket connected"
            );
        }
    );
}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadActiveRide();

        setupActiveRideSocket();

    }
);

</script>

</body>
    </html>
